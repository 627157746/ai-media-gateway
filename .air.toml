# air 热重载配置（开发用）。启动：air
# 出错日志：.tmp/build-errors.log
#
# 说明：
# - .env 是可选文件（已在 .gitignore），不存在时 air 不报错，回退到系统环境变量。
# - include_ext 含 "js"/"css"/"html"：管理后台前端 assets 是 go:embed 进二进制的，
#   只改前端也要重新编译才会生效。

root = "."
tmp_dir = ".tmp"

env_files = [".env"]

[build]
  # 本项目入口是 ./cmd/gateway 包（不是根目录 main 包）
  cmd = "go build -o ./.tmp/gateway.exe ./cmd/gateway"
  bin = "./.tmp/gateway.exe"
  entrypoint = ["./.tmp/gateway.exe"]
  delay = 1000
  # 不监视 .tmp（air 自身产物）、data（sqlite db/wal，写入会引发无限重建）
  exclude_dir = [".tmp", "data", "bin", "vendor", "testdata", ".git", ".trellis"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "html", "js", "css"]
  poll = false          # Windows 11 + 本地磁盘用 fsnotify；网络盘/同步盘才需要改 true
  stop_on_error = true  # 编译失败就停旧进程，避免端口被旧版本占着看到假象
  send_interrupt = true
  kill_delay = "2s"
  log = "build-errors.log"

[log]
  time = true
